<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Byte's personal website</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bubble-container">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>
    <main class="bento-grid">

        <!-- PROFILE -->
        <article class="bento-box profile-box glass">
            <img src="./assets/images/byte-sunset.jpg" alt="Byte" class="profile-img">
            <div class="profile-text">
                <h1>BYTE</h1>
                <p class="pronouns">HE/HIM ⊹ Netherlands</p>
            </div>
        </article>

        <!-- BIO -->
        <article class="bento-box bio-box glass">
            <h2>🫧 Fact</h2>
            <p>Expert at doing nothing</p>
        </article>

        <!-- DISCORD STATUS -->
        <article class="bento-box status-box glass">
            <h2>🍃 Discord Status</h2>
            <p id="discord-status-text">Checking Discord...</p>
            <div class="status-row">
                <div class="status-indicator" id="status-dot"></div>
                <span id="status-label" class="subtext">Offline</span>
            </div>
        </article>

        <!-- GALLERY -->
        <article class="bento-box gallery-box glass">
            <img src="./assets/images/byte-camera.jpg" alt="Gallery" class="gallery-img" id="gallery-target">
        </article>

        <!-- SOCIALS -->
        <article class="bento-box socials-box glass">
            <h2>🧸 Socials</h2>
            <div class="link-buttons">
                <a href="https://discord.com/users/416887610233847820" class="social-btn selectable"><span class="icon">💬</span> Discord</a>
                <a href="https://x.com/ProbablyFurByte" class="social-btn selectable"><span class="icon">🐦</span> Twitter</a>
                <a href="https://www.youtube.com/@FurByte_" class="social-btn selectable"><span class="icon">📺</span> YouTube</a>
                <a href="https://steamcommunity.com/id/FurByte/" class="social-btn selectable"><span class="icon">🎮</span> Steam</a>
                <a href="https://www.tiktok.com/@probablyfurbyte" class="social-btn selectable"><span class="icon">📱</span> TikTok</a>
            </div>
        </article>

        <!-- GUESTBOOK (replaces Thoughts/Quotes) -->
        <article class="bento-box guestbook-box glass">
            <h2>📖 Guestbook</h2>

            <!-- Messages feed -->
            <div class="gb-feed" id="gb-feed">
                <p class="gb-empty subtext">Loading messages...</p>
            </div>

            <!-- Submit form -->
            <div class="gb-form" id="gb-form">
                <input  type="text" id="gb-name"    class="gb-input" placeholder="Your name"    maxlength="40" autocomplete="off">
                <textarea              id="gb-message" class="gb-input gb-textarea" placeholder="Leave a message…" maxlength="200" rows="2"></textarea>
                <button id="gb-submit" class="gb-btn">Send ✉️</button>
                <p id="gb-status" class="gb-status subtext"></p>
            </div>
        </article>

        <!-- LOCAL TIME -->
        <article class="bento-box extra-box glass">
            <h2>🌍 Local Time</h2>
            <div class="time-container">
                <div class="main-time" id="clock-24">00:00</div>
                <div class="sub-time" id="clock-12">00:00 AM</div>
            </div>
            <p class="subtext">Amsterdam, NL (GMT+1)</p>
        </article>

    </main>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
